<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Rent A Vehicle</title>
  <link rel="icon" type="image/png" href="assets/images/car-transparent.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <script src="assets/js/theme-manager.js"></script>
  <style>
    body.rp-body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at 88% 8%, rgba(19,87,81,0.34), transparent 42%),
        radial-gradient(circle at 10% 88%, rgba(229,140,78,0.24), transparent 36%),
        linear-gradient(148deg, #f8faf8 0%, #eef3ef 50%, #e7edeb 100%);
      color: #1a2a2f;
      padding: 1.5rem;
    }

    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes softFade {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes gentleDrift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(5px, -7px) scale(1.03); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 8px 22px rgba(20,95,89,0.25); }
      50%      { box-shadow: 0 8px 30px rgba(20,95,89,0.4); }
    }

    .rp-card {
      animation: cardSlideIn 0.5s cubic-bezier(0.22,0.9,0.36,1) 0.06s both;
      position: relative;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.55);
      background: linear-gradient(150deg, rgba(255,255,255,0.93), rgba(242,247,244,0.76));
      backdrop-filter: blur(10px);
      box-shadow: 0 28px 64px rgba(7,31,34,0.15);
      padding: 2.5rem 2rem;
      overflow: hidden;
    }
    @media (min-width: 480px) { .rp-card { padding: 2.8rem 2.5rem; } }

    .rp-card::before {
      content: '';
      position: absolute;
      inset: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, rgba(229,140,78,0.2), rgba(44,118,110,0.75), rgba(229,140,78,0.2));
      pointer-events: none;
    }

    .rp-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(14px);
      animation: gentleDrift 7s ease-in-out infinite;
    }

    .rp-icon-box {
      width: 52px;
      height: 52px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #145f59, #1f7b73);
      animation: pulse-glow 2.6s ease-in-out infinite;
    }

    .rp-heading {
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #1a2a2f;
      margin: 0;
    }
    .rp-subtitle {
      text-align: center;
      font-size: 13px;
      color: #5f7378;
      margin-top: 6px;
      line-height: 1.5;
    }

    .rp-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #3a5558;
      margin-bottom: 6px;
    }

    .rp-field-wrap {
      position: relative;
    }
    .rp-field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: #7a9a9e;
      pointer-events: none;
    }
    .rp-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: #7a9a9e;
      transition: color 0.2s;
      line-height: 0;
    }
    .rp-toggle-btn:hover { color: #145f59; }
    .rp-toggle-btn svg { width: 18px; height: 18px; }

    .rp-input {
      width: 100%;
      padding: 11px 42px 11px 42px;
      border-radius: 14px;
      border: 1.5px solid rgba(24,54,58,0.15);
      background: rgba(255,255,255,0.82);
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      color: #1a2a2f;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .rp-input:focus {
      border-color: #145f59;
      box-shadow: 0 0 0 3px rgba(20,95,89,0.1);
    }
    .rp-input::placeholder { color: #9bb0b4; }

    .rp-strength-track {
      height: 4px;
      border-radius: 2px;
      background: rgba(24,54,58,0.07);
      margin-top: 8px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .rp-strength-track.visible { opacity: 1; }
    .rp-strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0;
      transition: width 0.35s, background-color 0.35s;
    }
    .rp-hint {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
      min-height: 16px;
      transition: color 0.2s;
    }

    .rp-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 24px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #145f59, #1a7a72);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(20,95,89,0.3);
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
      margin-top: 8px;
    }
    .rp-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px rgba(20,95,89,0.38);
    }
    .rp-submit:active { transform: translateY(0); }
    .rp-submit:disabled { opacity: 0.55; pointer-events: none; }
    .rp-submit svg { width: 18px; height: 18px; flex-shrink: 0; }

    .rp-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #3f5557;
      text-decoration: none;
      transition: color 0.2s;
    }
    .rp-back:hover { color: #145f59; }
    .rp-back svg { width: 14px; height: 14px; }

    .rp-banner {
      border-radius: 14px;
      padding: 12px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .rp-banner.success {
      border: 1px solid rgba(44,118,110,0.2);
      background: rgba(44,118,110,0.07);
      color: #145f59;
    }
    .rp-banner.error {
      border: 1px solid rgba(200,60,60,0.18);
      background: rgba(200,60,60,0.05);
      color: #9b2c2c;
    }

    .rp-section { animation: softFade 0.44s ease both; }
    .rp-section-d1 { animation-delay: 0.1s; }
    .rp-section-d2 { animation-delay: 0.18s; }
    .rp-section-d3 { animation-delay: 0.26s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .rp-spinner { animation: spin 0.7s linear infinite; }
  </style>
</head>
<body class="rp-body vrs-page">
  <!-- Decorative orbs -->
  <div class="rp-orb" style="right:-80px;top:-60px;width:200px;height:200px;background:radial-gradient(circle at 32% 28%,rgba(229,140,78,0.65),rgba(229,140,78,0.08));opacity:0.7" aria-hidden="true"></div>
  <div class="rp-orb" style="left:-60px;bottom:-60px;width:180px;height:180px;background:radial-gradient(circle at 32% 30%,rgba(44,118,110,0.5),rgba(44,118,110,0.1));opacity:0.7;animation-delay:0.6s" aria-hidden="true"></div>

  <div class="rp-card">
    <!-- Header -->
    <div class="rp-section rp-section-d1" style="margin-bottom:28px">
      <div class="rp-icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 class="rp-heading">Reset Your Password</h1>
      <p class="rp-subtitle">Choose a strong new password for your account</p>
    </div>

    <!-- Banners -->
    <div id="successBanner" class="rp-banner success" style="display:none">Password reset successful! Redirecting to login...</div>
    <div id="errorBanner" class="rp-banner error" style="display:none"><span id="errorText"></span></div>

    <!-- Form -->
    <form id="resetForm" class="rp-section rp-section-d2">
      <div style="margin-bottom:20px">
        <label for="newPassword" class="rp-label">New Password</label>
        <div class="rp-field-wrap">
          <svg class="rp-field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="newPassword" name="newPassword" required minlength="8" class="rp-input" placeholder="Min 8 characters" autocomplete="new-password" />
          <button type="button" class="rp-toggle-btn" data-toggle="newPassword" tabindex="-1" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <div class="rp-strength-track" id="strengthTrack">
          <div class="rp-strength-fill" id="strengthFill"></div>
        </div>
        <div class="rp-hint" id="strengthLabel" style="color:#7a9a9e"></div>
      </div>

      <div style="margin-bottom:24px">
        <label for="confirmPassword" class="rp-label">Confirm Password</label>
        <div class="rp-field-wrap">
          <svg class="rp-field-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" class="rp-input" placeholder="Re-enter your password" autocomplete="new-password" />
          <button type="button" class="rp-toggle-btn" data-toggle="confirmPassword" tabindex="-1" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <div class="rp-hint" id="matchHint"></div>
      </div>

      <button type="submit" id="submitBtn" class="rp-submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
        Reset Password
      </button>
    </form>

    <!-- Back link -->
    <div class="rp-section rp-section-d3" style="text-align:center;margin-top:24px">
      <a href="login.html" class="rp-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to Login
      </a>
    </div>
  </div>

  <!-- Supabase Client -->
  <script src="assets/js/supabase.config.local.js"></script>
  <script src="assets/js/supabase.config.js"></script>
  <script src="assets/js/supabase.client.js"></script>

  <script>
    (async function () {
      'use strict';

      var form         = document.getElementById('resetForm');
      var submitBtn    = document.getElementById('submitBtn');
      var pwInput      = document.getElementById('newPassword');
      var confirmInput = document.getElementById('confirmPassword');
      var successEl    = document.getElementById('successBanner');
      var errorEl      = document.getElementById('errorBanner');
      var errorText    = document.getElementById('errorText');
      var strengthTrack = document.getElementById('strengthTrack');
      var strengthFill  = document.getElementById('strengthFill');
      var strengthLabel = document.getElementById('strengthLabel');
      var matchHint     = document.getElementById('matchHint');

      /* ── helpers ── */
      function showError(msg) {
        errorText.textContent = msg;
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
      }
      function showSuccess() {
        successEl.style.display = 'block';
        errorEl.style.display = 'none';
        form.style.display = 'none';
      }
      function setBusy(busy) {
        submitBtn.disabled = busy;
        submitBtn.innerHTML = busy
          ? '<svg class="rp-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/><path d="M12 2a10 10 0 019.95 9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg> Resetting\u2026'
          : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Reset Password';
      }

      /* ── strength meter ── */
      var levels = [
        { w: '0%',   c: 'transparent', t: '' },
        { w: '25%',  c: '#d9534f',     t: 'Weak' },
        { w: '50%',  c: '#d9884f',     t: 'Fair' },
        { w: '75%',  c: '#5cb85c',     t: 'Good' },
        { w: '100%', c: '#145f59',     t: 'Strong' },
      ];
      function score(pw) {
        var s = 0;
        if (pw.length >= 8)  s++;
        if (pw.length >= 12) s++;
        if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
        if (/\d/.test(pw))   s++;
        if (/[^a-zA-Z0-9]/.test(pw)) s++;
        return Math.min(s, 4);
      }
      pwInput.addEventListener('input', function () {
        var v = pwInput.value;
        if (!v.length) {
          strengthTrack.classList.remove('visible');
          strengthLabel.textContent = '';
          checkMatch();
          return;
        }
        strengthTrack.classList.add('visible');
        var l = levels[score(v)];
        strengthFill.style.width = l.w;
        strengthFill.style.backgroundColor = l.c;
        strengthLabel.textContent = l.t;
        strengthLabel.style.color = l.c;
        checkMatch();
      });
      confirmInput.addEventListener('input', checkMatch);
      function checkMatch() {
        var cp = confirmInput.value;
        if (!cp) { matchHint.textContent = ''; return; }
        if (pwInput.value === cp) {
          matchHint.textContent = 'Passwords match';
          matchHint.style.color = '#145f59';
        } else {
          matchHint.textContent = 'Passwords do not match';
          matchHint.style.color = '#d9534f';
        }
      }

      /* ── show / hide toggle ── */
      var eyeOpen  = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
      var eyeShut  = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>';
      document.querySelectorAll('.rp-toggle-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var inp = document.getElementById(btn.getAttribute('data-toggle'));
          if (!inp) return;
          var show = inp.type === 'password';
          inp.type = show ? 'text' : 'password';
          btn.innerHTML = show ? eyeShut : eyeOpen;
        });
      });

      /* ── token check ── */
      var hash = new URLSearchParams(window.location.hash.substring(1));
      if (!hash.get('access_token') || hash.get('type') !== 'recovery') {
        showError('Invalid or expired reset link. Please request a new password reset.');
        form.style.display = 'none';
        return;
      }

      /* ── submit ── */
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var pw = pwInput.value.trim();
        var cp = confirmInput.value.trim();

        if (pw.length < 8) { showError('Password must be at least 8 characters.'); return; }
        if (pw !== cp)      { showError('Passwords do not match.'); return; }

        setBusy(true);
        errorEl.style.display = 'none';

        try {
          var client = await window.SupabaseClient.init();
          var res = await client.auth.updateUser({ password: pw });
          if (res.error) throw res.error;
          showSuccess();
          setTimeout(function () { window.location.href = 'login.html'; }, 2000);
        } catch (err) {
          console.error('Password reset error:', err);
          showError(err.message || 'Failed to reset password. Please try again.');
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
