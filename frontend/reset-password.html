<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Rent A Vehicle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <!-- Logo/Header -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Reset Password</h1>
        <p class="text-gray-600">Enter your new password below</p>
      </div>

      <!-- Success Message (hidden by default) -->
      <div id="successMessage" class="hidden mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
        <p class="text-green-800 text-sm text-center font-medium">
          ✅ Password reset successful! Redirecting to login...
        </p>
      </div>

      <!-- Error Message (hidden by default) -->
      <div id="errorMessage" class="hidden mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p id="errorText" class="text-red-800 text-sm text-center"></p>
      </div>

      <!-- Reset Form -->
      <form id="resetForm" class="space-y-6">
        <!-- New Password -->
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
            New Password
          </label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            required
            minlength="8"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            placeholder="Enter new password (min 8 characters)"
          />
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
            Confirm Password
          </label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
            minlength="8"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            placeholder="Confirm new password"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
        >
          Reset Password
        </button>
      </form>

      <!-- Back to Login -->
      <div class="mt-6 text-center">
        <a href="login.html" class="text-sm text-blue-600 hover:text-blue-700 font-medium">
          ← Back to Login
        </a>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-600 text-sm mt-6">
      © 2026 Rent A Vehicle. All rights reserved.
    </p>
  </div>

  <!-- Supabase Client -->
  <script src="assets/js/supabase-client.js"></script>

  <!-- Reset Password Script -->
  <script>
    (async function() {
      'use strict';

      const form = document.getElementById('resetForm');
      const submitBtn = document.getElementById('submitBtn');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');

      function showError(message) {
        errorText.textContent = message;
        errorMessage.classList.remove('hidden');
        successMessage.classList.add('hidden');
      }

      function showSuccess() {
        successMessage.classList.remove('hidden');
        errorMessage.classList.add('hidden');
        form.classList.add('hidden');
      }

      function setBusy(busy) {
        submitBtn.disabled = busy;
        submitBtn.textContent = busy ? 'Resetting...' : 'Reset Password';
      }

      // Check if we have an access token in the URL (from email link)
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = hashParams.get('access_token');
      const type = hashParams.get('type');

      if (!accessToken || type !== 'recovery') {
        showError('Invalid or expired reset link. Please request a new password reset.');
        form.classList.add('hidden');
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newPassword = newPasswordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        // Validation
        if (newPassword.length < 8) {
          showError('Password must be at least 8 characters long.');
          return;
        }

        if (newPassword !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        setBusy(true);
        errorMessage.classList.add('hidden');

        try {
          const client = await window.SupabaseClient.init();

          // Update password
          const { error } = await client.auth.updateUser({
            password: newPassword
          });

          if (error) {
            throw error;
          }

          // Success!
          showSuccess();

          // Redirect to login after 2 seconds
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);

        } catch (err) {
          console.error('Password reset error:', err);
          showError(err.message || 'Failed to reset password. Please try again.');
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
