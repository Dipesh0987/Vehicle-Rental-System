<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preparing Search | Rent A Vehicle</title>
    <link rel="stylesheet" href="assets/css/tailwind.css" />
    <style>
      :root {
        --admin-surface: #f4f3ef;
        --admin-surface-soft: #e9e0d7;
        --admin-ink: #182227;
        --admin-teal: #2d7a72;
        --admin-accent: #e58c4e;
      }

      @keyframes softFloat {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes shimmerSweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes pulseDot {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.62;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }

      .loader-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 0%, rgba(255, 255, 255, 0.7) 50%, transparent 100%);
        animation: shimmerSweep 1.2s ease-in-out infinite;
      }

      .pulse-dot {
        animation: pulseDot 1s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="relative flex min-h-screen items-center justify-center overflow-clip bg-[linear-gradient(160deg,#f7f4ec,#ebe3d8)] px-6 font-poppins text-[#182227]">
    <div class="pointer-events-none absolute -left-12 -top-16 h-72 w-72 rounded-full bg-[radial-gradient(circle_at_32%_30%,rgba(229,140,78,0.44),rgba(229,140,78,0.06))] blur-sm [animation:softFloat_5.5s_ease-in-out_infinite]"></div>
    <div class="pointer-events-none absolute -bottom-16 -right-12 h-72 w-72 rounded-full bg-[radial-gradient(circle_at_38%_35%,rgba(45,122,114,0.44),rgba(45,122,114,0.06))] blur-sm [animation:softFloat_6.2s_ease-in-out_infinite]"></div>

    <section class="w-full max-w-xl rounded-[28px] border border-[rgba(23,57,60,0.14)] bg-[linear-gradient(160deg,var(--admin-surface),var(--admin-surface-soft))] p-8 shadow-[0_26px_56px_rgba(7,31,34,0.16)]">
      <p class="inline-flex items-center gap-2 rounded-full border border-[rgba(45,122,114,0.2)] bg-[rgba(45,122,114,0.1)] px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.12em] text-[#2d7068]">
        <span class="pulse-dot h-2 w-2 rounded-full bg-[#2d7a72]"></span>
        Initializing Smart Search
      </p>
      <h1 class="mt-4 text-[31px] font-extrabold leading-tight tracking-[-0.02em] text-[#182227]">Routing You to the Unified Vehicle Search Experience</h1>
      <p class="mt-3 text-[14px] leading-relaxed text-[#3f5c5f]">We merged advanced search into the vehicles workspace for a faster, cleaner workflow with live catalog sync and premium filtering.</p>

      <div class="mt-6 space-y-2">
        <div class="loader-bar relative h-2 overflow-clip rounded-full bg-white/75"></div>
        <div class="loader-bar relative h-2 w-[84%] overflow-clip rounded-full bg-white/75"></div>
      </div>

      <div class="mt-6 flex flex-wrap items-center gap-3">
        <a href="vehicles.html#vehicleSearchTop" class="inline-flex rounded-full bg-[linear-gradient(135deg,var(--admin-accent),#d57635)] px-6 py-2.5 text-[13px] font-semibold text-white transition duration-200 hover:-translate-y-[1px] hover:brightness-105">Open Vehicles Search</a>
        <span id="searchRedirectLabel" class="text-[12px] font-semibold text-[#4a6569]">Redirecting in 2.8s...</span>
      </div>
    </section>

    <script>
      (function () {
        var label = document.getElementById("searchRedirectLabel");
        var remaining = 2.8;
        var timer = window.setInterval(function () {
          remaining = Math.max(0, remaining - 0.2);
          if (label) {
            label.textContent = "Redirecting in " + remaining.toFixed(1) + "s...";
          }

          if (remaining <= 0) {
            window.clearInterval(timer);
          }
        }, 200);

        window.setTimeout(function () {
          window.location.replace("vehicles.html#vehicleSearchTop");
        }, 2800);
      })();
    </script>
  </body>
</html>
