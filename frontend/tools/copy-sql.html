<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Copy AI Chat SQL</title>
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <style>
      .container{max-width:980px;margin:36px auto;padding:18px}
      textarea.sql-box{width:100%;height:420px;padding:12px;font-family:ui-monospace,monospace;background:#f7faf9;border:1px solid #e2e8f0;border-radius:8px}
    </style>
  </head>
  <body class="vrs-page">
    <main class="container">
      <h1 class="text-2xl font-bold mb-3">AI Chat SQL — Setup & Validation</h1>
      <p class="mb-4 text-sm text-slate-600">This helper loads the SQL file and provides one-click Copy and Download controls. The SQL file remains in <code>database/queries/</code>.</p>

      <div class="mb-3">
        <button id="copyBtn" class="vrs-ai-chat__action mr-2">Copy SQL</button>
        <button id="downloadBtn" class="vrs-ai-chat__action">Download SQL</button>
      </div>

      <textarea id="sqlBox" class="sql-box" readonly aria-label="SQL content">Loading…</textarea>

      <p class="mt-3 text-sm text-slate-500">If the SQL fails to load, open <code>database/queries/ai_chat_setup_and_validation.sql</code> directly in the repo.</p>
    </main>

    <script src="../assets/js/copy-sql.js"></script>
  </body>
</html>
